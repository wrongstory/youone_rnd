name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: youone_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youone_test
      M03_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youone_m03_test
      M04_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youone_m04_test
      M05_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youone_m05_test
      M06_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youone_m06_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create isolated feature test databases
        run: |
          psql "$TEST_DATABASE_URL" --set ON_ERROR_STOP=1 --command "create database youone_m03_test"
          psql "$TEST_DATABASE_URL" --set ON_ERROR_STOP=1 --command "create database youone_m04_test"
          psql "$TEST_DATABASE_URL" --set ON_ERROR_STOP=1 --command "create database youone_m05_test"
          psql "$TEST_DATABASE_URL" --set ON_ERROR_STOP=1 --command "create database youone_m06_test"

      - name: Set up pnpm
        uses: pnpm/setup@v1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm check

  m07-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: youone_m07_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d youone_m07_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      M07_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youone_m07_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify M07 PostgreSQL boundary
        run: pnpm exec vitest run tests/m07/postgres.integration.test.ts

